services:
  - type: web
    name: telegram-bingo-tournament-bot
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: BINGO_BOT_USERNAME
        sync: false
      - key: DATABASE_PATH
        value: ./database.sqlite
        sync: false
    mountPaths:
      - key: database
        path: /usr/src/app/database.sqlite
    persistentDiskGB: 1
